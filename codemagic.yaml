  # The same Places review with a 24-minute limit, for a build that must fit what is left of the
  # chapter's 90 free minutes. It sets its own UI deadline, PLACES_UI_DEADLINE_SECONDS=1110 (a plain,
  # non-secret value); everything else is identical to proximeet-places-review.
  # Places (chapter 07) runtime review, and the earlier chapters' checks on the same code. Manual
  # start only: no triggering section, no code signing, Apple credentials, provisioning,
  # archive/IPA, TestFlight, publishing, notifications or environment groups. Run inputs:
  # PLACES_EXPECTED_COMMIT (full 40-hex SHA; required) pins the exact revision and
  # PLACES_REVIEW_SCOPE (gate_finish | sweep_finish | correction | sweep | regressions | places | signal; required)
  # picks the scope; each scope is its own build, and what it runs comes from
  # docs/verification/places-review-manifest.tsv. No
  # automatic test retries. Compile-path steps stop the build on failure; evidence steps use
  # ignore_failure so later evidence is still collected; the last step fails the build unless the
  # automated verdict is PASS. See docs/verification/places-mac-review.md.
  proximeet-places-review-short:
    name: Proximeet Places review, 24-minute limit (manual, unsigned simulator)
    instance_type: mac_mini_m2
    max_build_duration: 24
    environment:
      xcode: "26.6"
      vars:
        PLACES_UI_DEADLINE_SECONDS: "1110"
    scripts:
      - name: Record source revision, host and tool versions (fails unless Xcode 26.6)
        script: bash scripts/codemagic_verify.sh metadata
      - name: Source gate - exactly the reviewed Places revision and scope, its approved assets, the Signal, Places and intent colour guards
        script: bash scripts/places_review.sh checkpoint
      - name: Validate the checked-in Xcode project (no regeneration)
        script: bash scripts/codemagic_verify.sh validate
      - name: Select an installed iPhone simulator (iPhone 17 Pro Max preferred; no downloads)
        script: bash scripts/codemagic_verify.sh select-simulator
      - name: Destinations - report the iPhone 17 Pro Max target, start the first boots (and a smaller iPhone's, when the scope uses one)
        script: bash scripts/places_review.sh destinations
        ignore_failure: true
      - name: App compilation - Proximeet Debug for the simulator, code signing disabled
        script: bash scripts/codemagic_verify.sh build
      - name: Zip the unsigned simulator app (simulator only; not installable on a device)
        script: bash scripts/codemagic_verify.sh package
        ignore_failure: true
      - name: ProximeetDomain tests on the Mac host (swift test, Places, Signal, age-gate return, Wristband, Guest List, Pass and Birthday rules)
        script: bash scripts/codemagic_verify.sh domain-tests
        ignore_failure: true
      - name: XCTest review for the run's scope, by the manifest (places - recorded journey, seven screens on two widths, eligibility, routes; signal; regressions), no retries
        script: bash scripts/places_review.sh ui-review
        ignore_failure: true
      - name: Compact walkthrough video (half size, trimmed to the app; original kept; places scope)
        script: bash scripts/places_review.sh compact-video
        ignore_failure: true
      - name: Verdict - automated results apart from outstanding manual review
        script: bash scripts/places_review.sh verdict
        ignore_failure: true
      - name: Package Places-Review.zip, Places-Screens.zip and the walkthrough downloads (places), or the scope's review zip
        script: bash scripts/places_review.sh package-review
        ignore_failure: true
      - name: Enforce the automated verdict (fails the build unless PASS)
        script: bash scripts/places_review.sh enforce
    artifacts:
      - build/artifacts/Places-Review.zip
      - build/artifacts/Places-Review.zip.sha256
      - build/artifacts/Places-Screens.zip
      - build/artifacts/Places-Screens.zip.sha256
      - build/artifacts/Places-walkthrough-compact.zip
      - build/artifacts/Places-walkthrough-compact.zip.sha256
