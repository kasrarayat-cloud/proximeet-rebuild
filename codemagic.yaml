      - name: XCTest review for the run's scope by the manifest (the shared queue of both iPhone 17 Pro Max simulators after a boot barrier), no retries
        script: bash scripts/places_review.sh ui-review
        ignore_failure: true
      - name: Verdict - automated results apart from outstanding manual review
