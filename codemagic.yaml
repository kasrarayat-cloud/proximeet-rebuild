  # The same Places review with a 35-minute limit, for the recovery after the Places correction:
  # build 2, correction (Codemagic 6ab8c585, on 808950f), then gate_finish (build 3) and sweep_finish
  # (build 4), each started by hand with PLACES_EXPECTED_COMMIT (full 40-hex SHA; required) and its own
  # PLACES_REVIEW_SCOPE (required; any manifest scope is accepted). It sets its own UI deadline,
  # PLACES_UI_DEADLINE_SECONDS=1740 (a plain, non-secret value; at the worst 72 + 1740 + 75 + 100 +
  # about 45 = 2032 s of its 2100; raised from 1680 after build 6ab8adb4). One step more than proximeet-places-review: straight after the app
  # zip, scripts/places_review.sh preview-app copies the just-built app to build/preview/Proximeet.app
  # with build/preview/PREVIEW.txt (the source commit, the zip's SHA-256, and a line saying a runnable
  # app is not evidence that its checks passed); it never fails the build. Codemagic offers Quick
  # Launch for a .app artifact only to teams with App Preview; on other accounts the .app is a plain
  # download. scripts/places_recovery_reconcile.py reconciles the builds' results row by row.
  # Manual start only: no triggering section, no code signing, Apple credentials, provisioning,
  # archive/IPA, TestFlight, publishing, notifications or environment groups. No automatic test
  # retries. Compile-path steps stop the build on failure; evidence steps use ignore_failure so later
  # evidence is still collected; the last step fails the build unless the automated verdict is PASS.
  # See docs/verification/places-mac-review.md.
  # Recovery build 5 (scope regression_finish), a further authorisation after build 4 ran out of time: at most 40
  # minutes. No runnable preview copy and no compact video (the app already tested in build 3 is the preview;
